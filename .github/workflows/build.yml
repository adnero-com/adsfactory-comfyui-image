name: Build and push adsfactory-comfyui

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/adsfactory-comfyui

jobs:
  # Fast gate (seconds, no GPU, no image). Two layers, both blocking the
  # (~25 min, ~20GB) build below rather than running beside it:
  #
  #   1. the PURE helpers -- the complete per-instance ComfyUI argv (frozen
  #      against a healthy production pod's own /system_stats), the device-token
  #      verification, and the instance -> port -> GPU mapping incl. the CLAMP
  #      that stops COMFY_INSTANCES from overcommitting a card;
  #   2. a real SPAWN -- the entrypoint is actually executed against a stub
  #      ComfyUI that records its argv/CUDA_VISIBLE_DEVICES and opens a real
  #      socket, so "the mapping is right but nothing is listening" fails here
  #      instead of on a rented pod. That is exactly what happened on
  #      2026-09-07 (pod bet287qx74j8v5): unit tests green, container
  #      unreachable, 900s of 404s. Needs root (it creates /ComfyUI, the image's
  #      WORKDIR, and binds 8188/8189) -- hence sudo.
  entrypoint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit-test the argv, the device verification and the mapping
        run: bash ./test_entrypoint.sh
      - name: Spawn-test the real argv + that every instance actually LISTENS
        run: sudo -E bash ./test_entrypoint_spawn.sh

  build-and-push:
    needs: entrypoint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The image is ~20GB uncompressed; hosted runners need the usual cleanup.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker system prune -af || true
          df -h /

      # SageAttention's 2-arch (sm_120 + sm_100) fp8/int8 kernels are RAM-heavy to
      # compile; the ~7GB runner OOMs even at MAX_JOBS=1 without extra swap. Add a
      # large swapfile (host swap is available to the buildkit RUN steps) so nvcc
      # spills instead of getting OOM-killed. (Freed disk above leaves room.)
      - name: Add swap for the CUDA compile
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          sudo fallocate -l 16G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=16384
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build + push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      # The digest is what a pod actually pulls -- surface it in the log and the
      # run summary so a deploy can cite the exact image it validated.
      - name: Report the pushed digest
        run: |
          echo "digest: ${{ steps.build.outputs.digest }}"
          echo "### Pushed ${{ env.IMAGE }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- tags: \`latest\`, \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
